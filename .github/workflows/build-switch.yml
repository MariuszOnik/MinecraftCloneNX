name: Build Switch

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:20260219
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure
        run: cmake --preset switch-release -DVOXELGAME_BUILD_COMMIT="$GITHUB_SHA"

      - name: Build NRO
        run: cmake --build --preset switch-release

      - name: Validate and stage package
        shell: bash
        run: |
          test -s build/switch-release/voxelgame.nro
          test "$(dd if=build/switch-release/voxelgame.nro bs=1 skip=16 count=4 status=none)" = "NRO0"
          mkdir -p out/VoxelGame-Switch/romfs
          cp build/switch-release/voxelgame.nro out/VoxelGame-Switch/
          cp build/switch-release/build-info.txt out/VoxelGame-Switch/
          cp -R romfs/. out/VoxelGame-Switch/romfs/

      - name: Upload Switch package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VoxelGame-Switch
          path: out/VoxelGame-Switch
          if-no-files-found: error
