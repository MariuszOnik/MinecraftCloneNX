name: Build Switch

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:20260219
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure
        run: cmake --preset switch-release -DVOXELGAME_BUILD_COMMIT="$GITHUB_SHA"

      - name: Build NRO
        run: cmake --build --preset switch-release

      - name: Validate and stage package
        shell: bash
        run: |
          # The tactics build ships as voxeltactics.nro with no assets in romfs;
          # find whichever NRO the preset produced.
          nro=$(ls build/switch-release/voxel*.nro | head -n1)
          app=$(basename "$nro" .nro)
          test -s "$nro"
          test "$(dd if="$nro" bs=1 skip=16 count=4 status=none)" = "NRO0"
          mkdir -p out/VoxelGame-Switch/romfs
          cp "$nro" out/VoxelGame-Switch/
          cp build/switch-release/build-info.txt out/VoxelGame-Switch/
          cp -R build/switch-release/romfs-stage/. out/VoxelGame-Switch/romfs/
          # Ready-to-copy SD-card tree: drop sdcard/ onto the Switch SD root,
          # then launch switch/<app>/<app>.nro from hbmenu. All assets (models,
          # atlases, animations, Lua scripts) load from sdmc:/switch/<app>/assets/.
          dst="out/VoxelGame-Switch/sdcard/switch/$app"
          mkdir -p "$dst"
          cp "$nro" "$dst/"
          cp -R assets "$dst/"
          test -f "$dst/$app.nro"
          test -f "$dst/assets/atlases/blocks.png"
          test -f "$dst/assets/scripts/battles/skirmish01.lua"

      - name: Upload Switch package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: VoxelGame-Switch
          path: out/VoxelGame-Switch
          if-no-files-found: error
