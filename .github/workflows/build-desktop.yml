name: Build desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure
        shell: pwsh
        run: cmake --preset pc-release -DVOXELGAME_BUILD_COMMIT=$env:GITHUB_SHA

      - name: Build
        run: cmake --build --preset pc-release

      - name: Test
        shell: pwsh
        run: ctest --preset pc-release --output-junit test-results.xml

      - name: Stage package
        shell: pwsh
        run: cmake --install build/pc-release --prefix out/VoxelGame-Windows

      - name: Upload Windows package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: VoxelGame-Windows
          path: out/VoxelGame-Windows
          if-no-files-found: error

      - name: Upload test report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: VoxelGame-Test-Report
          path: build/pc-release/test-results.xml
          if-no-files-found: error
