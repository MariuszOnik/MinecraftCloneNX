name: Build desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure
        shell: pwsh
        run: cmake --preset pc-release -DVOXELGAME_BUILD_COMMIT=$env:GITHUB_SHA

      - name: Build
        run: cmake --build --preset pc-release

      - name: Test
        shell: pwsh
        run: ctest --preset pc-release --output-junit build/pc-release/test-results.xml

      - name: Stage package
        shell: pwsh
        run: cmake --install build/pc-release --prefix out/VoxelGame-Windows

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VoxelGame-Windows
          path: out/VoxelGame-Windows
          if-no-files-found: error

      - name: Upload test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VoxelGame-Test-Report
          path: build/pc-release/test-results.xml
          if-no-files-found: error
